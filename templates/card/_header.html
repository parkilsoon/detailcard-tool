  <header class="head">
    <div class="head-top">{% if header.form %}<span class="pform">{{ header.form|em }}</span>{% endif %}<span class="corp">{{ header.company|em }}</span></div>
    <h1 class="pname">{{ header.product_name|em }}</h1>
    <p class="ingr">{{ header.ingredient|em }}{% if header.category %} · {{ header.category|em }}{% endif %}</p>
{% if header.badges %}    <div class="tags">
{% for b in header.badges %}      <span class="tag {{ b.kind }}">{{ b.text|em }}</span>
{% endfor %}    </div>
{% endif %}  </header>
